<!doctype html>
<meta charset="utf-8">
<title>Suit export</title>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js",
               "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";
import { buildSuit } from "/src/suit.js";
import { makeClips } from "/src/anim.js";

window.exportGLB = async () => {
  const suit = buildSuit();
  const clips = makeClips(suit.bones);
  const stats = {};
  suit.root.traverse((o) => { if (o.isSkinnedMesh) stats[o.name] = o.geometry.index.count / 3; });
  const buf = await new GLTFExporter().parseAsync(suit.root, { binary: true, animations: clips });
  let s = ""; const u8 = new Uint8Array(buf);
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return { b64: btoa(s), stats, bones: suit.bones.length, clips: clips.map((c) => [c.name, c.duration]) };
};
window.ready = true;
</script>
